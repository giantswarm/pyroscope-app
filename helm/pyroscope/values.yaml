psp:
  enabled: false
  name: pyroscope-capi

kyvernoPolicyExceptions:
  enabled: false
  namespace: giantswarm

pyroscope:
  serviceAccount:
    create: true

  architecture:
    microservices:
      enabled: true

  pyroscope:
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/pyroscope
      tag: 2.2.0
      pullPolicy: IfNotPresent

    replicaCount: 1

    config: |
      {{- if .Values.minio.enabled }}
      storage:
        backend: s3
        s3:
          endpoint: "{{ include "pyroscope.fullname" . }}-minio:9000"
          bucket_name: {{(index .Values.minio.buckets 0).name | quote }}
          access_key_id: {{ .Values.minio.rootUser | quote }}
          secret_access_key: {{ .Values.minio.rootPassword | quote }}
          insecure: true
      {{- end }}

    extraArgs:
      log.level: debug

    resources: {}

    serviceAccount:
      create: true
      annotations: {}
      name: ""

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    service:
      type: ClusterIP
      port: 4040
      port_name: http2
      scheme: HTTP

    memberlist:
      port: 7946
      port_name: memberlist

    # Left empty on purpose: the components are taken from the upstream
    # `architecture.microservices.v2` defaults, which carry the metastore raft
    # arguments and resource requests each v2 component needs.
    components: {}

  # -------------------------------------
  # Configuration for `grafana-agent` child chart
  # -------------------------------------
  agent:
    enabled: false

  # -------------------------------------
  # Configuration for `minio` child chart
  # -------------------------------------
  minio:
    # Required: the v2 storage architecture needs an object store shared by
    # segment-writer, compaction-worker and query-backend. Point `pyroscope.config`
    # at an external S3 bucket instead if one is available.
    enabled: true
    replicas: 1
    # Minio requires 2 to 16 drives for erasure code (drivesPerNode * replicas)
    # https://docs.min.io/docs/minio-erasure-code-quickstart-guide
    # Since we only have 1 replica, that means 2 drives must be used.
    drivesPerNode: 2
    rootUser: grafana-pyroscope
    rootPassword: supersecret
    buckets:
      - name: grafana-pyroscope-data
        policy: none
        purge: false
    persistence:
      size: 5Gi

  ingress:
    enabled: false
